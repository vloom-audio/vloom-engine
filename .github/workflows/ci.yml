name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Must match required_version in scripts/format.sh.
      - name: Install clang-format
        run: |
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install --disable-pip-version-check clang-format==23.1.3
          echo "CLANG_FORMAT=$RUNNER_TEMP/clang-format/bin/clang-format" >> "$GITHUB_ENV"
      - run: scripts/format.sh --check

  commit-messages:
    name: commit messages
    # Every commit in a pull request must be "<gitmoji> <type>(<scope>): <subject>".
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check_commit_messages.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake --preset release -DVLOOM_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset release --parallel

      - name: Test
        run: ctest --preset release

      - name: Render smoke test
        shell: bash
        run: |
          cli=build/release/tools/vloom-cli/vloom-cli
          [ -f "$cli" ] || cli=build/release/tools/vloom-cli/Release/vloom-cli.exe
          "$cli" --version
          "$cli" render click.wav --seconds 2

  sanitizers:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'tests/CMakeLists.txt') }}

      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} --parallel
      - run: ctest --preset ${{ matrix.preset }}
